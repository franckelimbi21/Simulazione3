<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esplora - Countries Atlas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='none' stroke='%230d6b7d' stroke-width='3'/><circle cx='50' cy='50' r='32' fill='%230d6b7d' opacity='0.3'/><circle cx='38' cy='38' r='12' fill='%230d6b7d'/><rect x='45' y='35' width='10' height='30' fill='%230d6b7d'/><rect x='35' y='45' width='30' height='10' fill='%230d6b7d'/></svg>">
</head>
<body>
    <main class="main-content">
        <section class="panel page-section">
            <h2>Esplora per Regione</h2>
            <p class="section-description">Filtra nazioni per continente tramite endpoint regione.</p>
            <div class="form-group region-group">
                <label for="region-select">Regione</label>
                <select id="region-select">
                    <option value="africa">Africa</option>
                    <option value="americas">Americas</option>
                    <option value="asia">Asia</option>
                    <option value="europe" selected>Europe</option>
                    <option value="oceania">Oceania</option>
                </select>
            </div>
        </section>

        <section class="page-section">
            <div id="explore-results" class="cards-grid"></div>
        </section>
    </main>

    <script type="module" src="../scripts/pages/explore.js"></script>
</body>
</html>
